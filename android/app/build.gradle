plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Signature « release » : créez android/keystore.properties (jamais commité) avec
//   storeFile=../viewcast-release.jks / storePassword=... / keyAlias=... / keyPassword=...
def keystoreFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.example.viewcast'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.viewcast"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4.0"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sans keystore.properties, la release est signée avec la clé de debug (installable pour tester, pas pour publier).
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        // 1.5.14 <-> Kotlin 1.9.24
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        // Évite qu'un avertissement de lint fasse échouer bundleRelease en CI.
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-ktx:1.9.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Compose
    implementation "androidx.compose.ui:ui:1.6.8"
    implementation "androidx.compose.foundation:foundation:1.6.8"
    implementation "androidx.compose.material3:material3:1.2.1"
    implementation "androidx.compose.material:material-icons-extended:1.6.8"
    implementation "androidx.compose.ui:ui-tooling-preview:1.6.8"
    implementation "androidx.activity:activity-compose:1.9.2"

    testImplementation "junit:junit:4.13.2"
}
